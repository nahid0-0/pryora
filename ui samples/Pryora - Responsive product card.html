<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pryora - Responsive product card</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--oxblood:#3A0D0D;--wine:#4F0C10;--gold:#B8892B;--goldtext:#8A6418;--champagne:#D9B04A;--cream:#FFFBF0;--ivory:#F2ECE0;--green:#1F4A36;
--serif:'Cormorant Garamond',Georgia,serif;--sans:'Jost',system-ui,sans-serif;--line:rgba(79,12,16,.12);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{background:var(--cream)}
body{--accent:var(--green);margin:0;background:var(--cream);color:var(--wine);font-family:var(--sans);font-weight:300;line-height:1.65}
body[data-a="b"]{--accent:var(--oxblood)}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

.nav{display:flex;justify-content:space-between;align-items:center;padding:20px clamp(16px,5vw,64px);background:var(--oxblood);color:var(--ivory)}
.mark{font-family:var(--serif);font-size:24px;letter-spacing:.32em}
.bag{border:1px solid var(--champagne);color:var(--champagne);padding:6px 16px;border-radius:99px;font-size:14px;background:none}
.wrap{max-width:1160px;margin:0 auto;padding:28px clamp(16px,5vw,48px) 80px}
.crumb{font-size:14px;color:var(--goldtext);margin:0 0 32px}
.crumb a:hover{text-decoration:underline}
.top{display:none}

.pdp{display:grid;grid-template-columns:1.1fr 1fr;grid-template-areas:"photo info" "photo side";grid-template-rows:auto 1fr;column-gap:clamp(32px,5vw,72px);align-items:start}
.hero{display:contents}
.photo{grid-area:photo;aspect-ratio:4/5;overflow:hidden;border:1px solid var(--line)}
.photo img{width:100%;height:100%;object-fit:cover;object-position:50% 55%;display:block}
.info{grid-area:info}
.side{grid-area:side}
.name{font-family:var(--serif);font-weight:400;font-size:clamp(40px,4.5vw,58px);line-height:1.05;margin:0 0 8px}
.price{font-family:var(--serif);font-size:30px;color:var(--goldtext);margin:0 0 20px}
.more{display:none;align-items:center;gap:8px;background:none;border:0;padding:8px 12px;font-size:15px;margin:0 auto}
.more svg{transition:transform .25s}.more[aria-expanded="true"] svg{transform:rotate(180deg)}
.moretext{margin:0 0 32px;max-width:46ch}
.moretext{display:block!important}
.opt{border:1px solid var(--line);margin-top:14px}
.opt summary{list-style:none;display:flex;justify-content:space-between;align-items:center;padding:14px 14px 14px 18px;cursor:pointer;font-family:var(--serif);font-size:24px}
.opt summary::-webkit-details-marker{display:none}
.sq{width:34px;height:34px;border:1px solid rgba(79,12,16,.3);position:relative;flex:none}
.sq::before,.sq::after{content:"";position:absolute;left:50%;top:50%;width:12px;height:1px;background:var(--wine);transform:translate(-50%,-50%)}
.sq::after{transform:translate(-50%,-50%) rotate(90deg)}
.opt[open] .sq::after{display:none}
.chips{display:flex;flex-wrap:wrap;gap:10px;padding:0 18px 18px}
.chips button{background:none;border:1px solid rgba(79,12,16,.2);padding:9px 16px;font-size:15px}
.chips button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);font-weight:400}
.add{position:relative;display:block;width:100%;margin-top:18px;padding:18px;background:var(--accent);color:var(--cream);border:0;font-size:16px;letter-spacing:.1em}
.add::after{content:"";position:absolute;inset:4px;border:1px solid rgba(255,251,240,.35);pointer-events:none}
.add:hover{filter:brightness(1.15)}
.deliv{margin:18px 0 0;font-size:14px;color:var(--goldtext)}
.demo{margin:56px 0 0;padding-top:20px;border-top:1px solid var(--line);font-size:14px;color:var(--goldtext);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.demo button{background:none;border:1px solid rgba(79,12,16,.2);padding:6px 14px;font-size:14px}
.demo button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}

@media(max-width:820px){
  .wrap{padding-top:20px}
  .crumb{display:none}
  .top{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;margin-bottom:18px}
  .top h2{font-family:var(--serif);font-weight:400;font-size:26px;margin:0;text-align:center}
  .back{width:44px;height:44px;background:none;border:1px solid rgba(79,12,16,.15)}
  .pdp{display:block}
  .hero{display:block;border:1px solid var(--line);padding:14px}
  .photo{aspect-ratio:1;border:0;margin-bottom:20px}
  .info{text-align:center}
  .name{font-size:36px;margin-bottom:6px}
  .price{font-size:28px;margin-bottom:12px}
  .more{display:flex}
  .moretext{display:block;margin:6px 6px 8px;font-size:15px;max-width:none}
  .moretext[hidden]{display:none!important}
  .deliv{text-align:center}
}
@media(min-width:821px){.moretext{display:block!important}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<script>
(function(){
  var mo=document.getElementById('more'),mt=document.getElementById('mt');
  mo.addEventListener('click',function(){var o=mo.getAttribute('aria-expanded')==='true';mo.setAttribute('aria-expanded',String(!o));mt.hidden=o});
  document.querySelectorAll('.chips').forEach(function(g){g.addEventListener('click',function(e){
    var b=e.target.closest('button');if(!b)return;
    g.querySelectorAll('button').forEach(function(x){x.setAttribute('aria-pressed',String(x===b))})})});
  var a=document.getElementById('add'),bag=document.getElementById('bag'),n=0,id;
  a.addEventListener('click',function(){n++;bag.textContent='Bag ('+n+')';a.textContent='Added to bag';clearTimeout(id);id=setTimeout(function(){a.textContent='Add to bag'},1800)});
  document.querySelectorAll('.demo button').forEach(function(b){b.addEventListener('click',function(){
    document.body.dataset.a=b.dataset.a;
    document.querySelectorAll('.demo button').forEach(function(x){x.setAttribute('aria-pressed',String(x===b))})})});
})();
</script>
